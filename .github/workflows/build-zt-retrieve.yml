# zt-retrieve onedir-bundle (linux x86_64). Julkaisu: GitHub Actions -artefakti tagista v*.

name: Build zt-retrieve

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build onedir + tarball
        env:
          ZT_RETRIEVE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0-dev' }}
        run: |
          chmod +x scripts/build_zt_retrieve.sh
          bash scripts/build_zt_retrieve.sh

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: zt-retrieve-linux-x86_64
          path: |
            dist/zt-retrieve/
            artifacts/zt-retrieve-*.tar.zst
            artifacts/zt-retrieve-*.tar.gz
          if-no-files-found: warn

      - name: Summary
        run: |
          ls -la dist/zt-retrieve/ || true
          ls -la artifacts/ || true
